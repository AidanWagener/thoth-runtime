<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- GitHub social preview image — 1280x640.
       Replace when designer delivers final brand assets.
       Lapis blue (#1E3A8A) + Egyptian gold (#D4AF37) palette. -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="50%" stop-color="#1E3A8A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#E6C350"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>

  <!-- Decorative top border -->
  <line x1="80" y1="80" x2="1200" y2="80" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>

  <!-- Wordmark THOTH centered -->
  <text x="640" y="270"
        font-family="Cinzel, Trajan Pro, Georgia, serif"
        font-size="120"
        font-weight="700"
        fill="url(#goldGrad)"
        text-anchor="middle"
        letter-spacing="0.15em">THOTH</text>

  <!-- Tagline -->
  <text x="640" y="340"
        font-family="Inter, -apple-system, sans-serif"
        font-size="28"
        font-weight="500"
        fill="#F5E6D3"
        opacity="0.85"
        text-anchor="middle"
        letter-spacing="0.06em">The lifelong-learning agent runtime.</text>

  <!-- Five layer markers -->
  <g transform="translate(640, 430)" text-anchor="middle"
     font-family="JetBrains Mono, ui-monospace, monospace"
     font-size="18"
     fill="#F5E6D3" opacity="0.6">
    <text x="-300" y="0">L1 working</text>
    <text x="-150" y="0">L2 identity</text>
    <text x="0"    y="0">L3 episodic</text>
    <text x="150"  y="0">L4 procedural</text>
    <text x="300"  y="0">L5 reflection</text>
  </g>

  <!-- Connecting line under the layers -->
  <line x1="280" y1="450" x2="1000" y2="450" stroke="#D4AF37" stroke-width="0.5" opacity="0.4"/>

  <!-- Five sefirot dots -->
  <g fill="#D4AF37">
    <circle cx="340" cy="450" r="3"/>
    <circle cx="490" cy="450" r="3"/>
    <circle cx="640" cy="450" r="4"/>
    <circle cx="790" cy="450" r="3"/>
    <circle cx="940" cy="450" r="3"/>
  </g>

  <!-- Footer -->
  <text x="640" y="540"
        font-family="Inter, sans-serif"
        font-size="20"
        font-weight="500"
        fill="#F5E6D3" opacity="0.5"
        text-anchor="middle"
        letter-spacing="0.04em">Open source · MIT · Built in Frankfurt</text>

  <text x="640" y="575"
        font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="16"
        fill="#D4AF37" opacity="0.7"
        text-anchor="middle">github.com/thoth-runtime/thoth</text>

  <!-- Decorative bottom border -->
  <line x1="80" y1="600" x2="1200" y2="600" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>

  <!-- Alchemical sigils (corners) -->
  <g font-family="Times, serif" font-size="28" fill="#D4AF37" opacity="0.5">
    <text x="100" y="115" text-anchor="middle">🜂</text>
    <text x="1180" y="115" text-anchor="middle">🜃</text>
    <text x="100" y="635" text-anchor="middle">🜁</text>
    <text x="1180" y="635" text-anchor="middle">🜄</text>
  </g>
</svg>
