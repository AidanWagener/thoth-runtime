name: Bug report
description: Something is not working as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the fields below; missing fields make it harder to help.
  - type: input
    id: version
    attributes:
      label: Thoth version
      description: Output of `thoth --version`
      placeholder: e.g. 0.5.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: e.g. v22.10.5
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (Ubuntu / Debian)
        - Linux (other)
        - macOS
        - Windows
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      description: Which chat transport were you using?
      options:
        - Slack
        - Discord
        - Webhook
        - None (CLI / dashboard only)
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A precise sequence that reproduces the problem.
      placeholder: |
        1. Run `thoth init my-project --template minimal`
        2. Set ALLOWED_USERS to U_TEST in .env
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: I expected ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Instead, I observed ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Please run with `LOG_LEVEL=debug` and paste relevant output. Redact any tokens.
      render: shell
  - type: textarea
    id: config
    attributes:
      label: Config (with secrets redacted)
      description: Relevant excerpt of your `thoth.config.ts` or `.env`. **Redact tokens.**
      render: typescript
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help?
